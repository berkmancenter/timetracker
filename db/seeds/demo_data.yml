# Timesheets get a UUID made from their key, so their links stay the same.
#
# fields: what every time entry has besides hours and date. The machine name
#   comes from the title like in the app ("Client matter" -> client_matter).
#   popular: top values in the sidebar, list: a column in the table,
#   access_key: alt+<key> jumps to the field in the entry form.
# members: role is admin or user. Members with hours_per_week get generated
#   entries on weekdays from the day they joined, pause_days leaves the last
#   days empty.
# generated: values for the generated entries, the first ones are picked more
#   often (so the sidebar has clear favourites), "" leaves the field empty.
# entries: written entries, on top of the generated ones.
# periods: credits are the hours a person should work in the period, with the
#   values of the period fields (e.g. funding source) for that person.
# invitations: to is the key of the invited email, without it the invitation
#   is a link anybody can use until it expires. used_by marks it used.
timesheets:
  - key: research-lab
    name: Research Lab
    created: 400 days ago
    fields:
      - title: Project
        list: true
        popular: true
        access_key: p
      - title: Activity
        list: true
        popular: true
        access_key: v
      - title: Notes
        input_type: long_text
        list: true
        access_key: n
    members:
      - user: maya
        role: admin
        joined: 380 days ago
        hours_per_week: 3
      - user: jonas
        role: user
        joined: 300 days ago
        hours_per_week: 8
      - user: priya
        role: user
        joined: 260 days ago
        hours_per_week: 12
      - user: sam
