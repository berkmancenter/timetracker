          Cleaned the second survey wave. Removed 14 duplicate answers (same
          respondent ID, submitted twice within a minute), recoded the "other"
          answers of question 7 into the existing categories and wrote down
          every change in the codebook so the numbers can be checked later.
      - user: priya
