# Use ./docker/test.sh to run the tests (see "Tests" in README.md).
#
# A name of its own, so it doesn't share containers with the development
# environment, and no published ports, so both can run at the same time.
name: timetracker_test

services:
  db:
    image: 'postgres:14'
    environment:
      POSTGRES_USER: timetracker_test
      POSTGRES_PASSWORD: so_wow_much_secure
      POSTGRES_DB: timetracker_test
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetracker_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    environment:
      - APP_ENV=test
    restart: always
