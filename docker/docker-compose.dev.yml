# Use the scripts: ./docker/start_dev.sh, shell_dev.sh, seed_dev.sh, stop_dev.sh
# (see "Development" in README.md).
#
# Without a name the project would be called "docker" (the folder of this
# file), like every other app keeping its compose files in docker/, and share
# their containers and database volume.
name: timetracker_dev

services:
  db:
    image: 'postgres:14'
    volumes:
      - 'db:/var/lib/postgresql/data'
      - '..:/app'
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DB_NAME}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '6868:3000'
      - '6767:5173' # Vite dev server (yarn dev in front/)
      - '6878:1080' # Mailcatcher
    volumes:
      - '..:/app'
    restart: always
    environment:
      - APP_ENV=development
      # true loads the demo data on every start, see "Demo data" in README.md
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-}
    command: >
      bash -c "./bin/rails demo:auto && ./bin/rails s -b 0.0.0.0"

volumes:
  db:
